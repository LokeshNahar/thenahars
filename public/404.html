<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>The Nahars</title>
    <!--
      GitHub Pages has no server-side router, so a deep link like /person/N-0010
      404s on refresh. This redirects to "/?/person/N-0010" which index.html's
      inline script restores to the real path before React Router mounts.
      https://github.com/rafgraph/spa-github-pages
    -->
    <script>
      var pathSegmentsToKeep = 1 // keep "/thenahars" segment on the *.github.io URL; becomes 0 on the custom domain

      var l = window.location
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname
            .split('/')
            .slice(0, 1 + pathSegmentsToKeep)
            .join('/') +
          '/?/' +
          l.pathname
            .slice(1)
            .split('/')
            .slice(pathSegmentsToKeep)
            .join('/')
            .replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
      )
    </script>
  </head>
  <body></body>
</html>
